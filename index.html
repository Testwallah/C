<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1728 Hours Ultra Countdown Timer 💎🔥</title>
    <style>
        @import url('https://googleapis.com');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top left, #1a0b2e, #090410, #000000);
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            overflow: hidden;
            padding: 20px;
        }

        /* Background Glowing Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: float 6s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 300px;
            height: 300px;
            background: #ff007f;
            top: 10%;
            left: 15%;
        }
        .orb-2 {
            width: 350px;
            height: 350px;
            background: #00f2fe;
            bottom: 10%;
            right: 15%;
            animation-delay: 2s;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }

        /* Main Glassmorphism Card */
        .timer-container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            padding: 40px 30px;
            text-align: center;
            max-width: 750px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.05);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00f2fe, #4facfe, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: #b3b3cc;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        /* Timer Boxes */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .time-box {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 18px;
            padding: 25px 20px;
            min-width: 150px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .time-box:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 30px rgba(255, 0, 127, 0.4);
            border-color: #ff007f;
        }

        .number {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.8);
            display: block;
        }

        .label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00f2fe;
            margin-top: 8px;
            display: block;
            font-weight: 600;
        }

        /* Progress Bar */
        .progress-wrapper {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            height: 10px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .progress-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff007f, #00f2fe);
            transition: width 1s linear;
        }

        /* Reset Button */
        .btn-reset {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            border: none;
            color: white;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 0, 127, 0.4);
            transition: all 0.3s ease;
        }

        .btn-reset:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 0, 127, 0.7);
        }

        @media (max-width: 600px) {
            .time-box { min-width: 110px; padding: 15px 10px; }
            .number { font-size: 2.2rem; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="timer-container">
        <h1>🔥 1728 HOURS MISSION TIMER 💎</h1>
        <p class="subtitle">72 दिनों का महा-काउंटडाउन शुरू हो चुका है! हर सेकंड कीमती है 🚀</p>

        <div class="countdown">
            <div class="time-box">
                <span class="number" id="hours">1728</span>
                <span class="label">Hours (घंटे)</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Minutes (मिनट)</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Seconds (सेकंड)</span>
            </div>
        </div>

        <div class="progress-wrapper">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <button class="btn-reset" onclick="resetTimer()">🔄 टाइमर रीसेट करें</button>
    </div>

    <script>
        const TOTAL_HOURS = 1728;
        const TOTAL_MS = TOTAL_HOURS * 60 * 60 * 1000;

        // चेक करें कि क्या पहले से कोई टारगेट टाइम सेव है
        let targetTime = localStorage.getItem('custom1728Timer');

        if (!targetTime) {
            targetTime = Date.now() + TOTAL_MS;
            localStorage.setItem('custom1728Timer', targetTime);
        }

        function updateTimer() {
            const now = Date.now();
            const remaining = targetTime - now;

            if (remaining <= 0) {
                document.getElementById('hours').innerText = "0000";
                document.getElementById('minutes').innerText = "00";
                document.getElementById('seconds').innerText = "00";
                document.getElementById('progress-bar').style.width = "0%";
                return;
            }

            // कुल बचे हुए घंटे, मिनट और सेकंड निकालें
            const hours = Math.floor(remaining / (1000 * 60 * 60));
            const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

            // स्क्रीन पर अपडेट करें
            document.getElementById('hours').innerText = String(hours).padStart(4, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');

            // प्रोग्रेस बार अपडेट करें
            const percentage = (remaining / TOTAL_MS) * 100;
            document.getElementById('progress-bar').style.width = percentage + "%";
        }

        function resetTimer() {
            if(confirm("क्या आप वाकई 1728 घंटे के टाइमर को फिर से शुरू करना चाहते हैं? 🤔")) {
                targetTime = Date.now() + TOTAL_MS;
                localStorage.setItem('custom1728Timer', targetTime);
                updateTimer();
            }
        }

        // हर 1 सेकंड में टाइमर चलाएं
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>

</body>
</html>
